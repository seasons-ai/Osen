appId: com.osen.desktop
# Latin package name: Electron cannot find helpers if folder and file names contain Cyrillic
# (electron-builder writes them in NFD, while Chromium looks them up in NFC). The displayed name is set by CFBundleDisplayName.
productName: Osen
directories:
  output: release.noindex
electronDist: ../../node_modules/electron/dist
files:
  - out/**
  - package.json
  - "!node_modules/**"
extraResources:
  - from: ../../templates
    to: templates
  - from: ../../packages/core/scenarios
    to: scenarios
  # MIT requires the licence text in every copy of the program
  - from: ../../LICENSE
    to: LICENSE
asar: true
# The child process that extracts PDF text is started by a path on disk; it cannot be read from the asar
asarUnpack:
  - out/main/pdf-*.mjs
  - out/main/html-worker.mjs
  - out/main/chunks/*.js
npmRebuild: false
# The UI loads over its own app:// protocol, file: rights are not needed. runAsNode is left alone:
# PDF text extraction runs Electron as Node. The remaining fuses are not set and stay as in Electron.
electronFuses:
  grantFileProtocolExtraPrivileges: false
mac:
  # The only source of the icon is the brand in design/, there is no copy in build/
  icon: ../../design/mockup-osen/brand/app-icon/icon.icns
  target:
    - target: dmg
      arch: arm64
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    CFBundleDisplayName: Osen
  notarize: false
dmg:
  artifactName: osen-${version}-${arch}.${ext}
